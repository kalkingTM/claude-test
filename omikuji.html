<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おみくじ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }
        #result {
            font-size: 4em;
            margin: 30px 0;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .fortune-text {
            font-size: 0.4em;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>おみくじ</h1>
        <div id="result">？</div>
        <button onclick="drawOmikuji()">引く</button>
    </div>

    <script>
        const fortunes = [
            { result: '大吉', message: '最高の運勢！何をやっても上手くいく！', color: '#e74c3c' },
            { result: '中吉', message: 'とても良い運勢です！', color: '#e67e22' },
            { result: '小吉', message: '良いことがありそうです', color: '#f1c40f' },
            { result: '吉', message: 'まずまずの運勢です', color: '#2ecc71' },
            { result: '末吉', message: '努力次第で運が開けます', color: '#3498db' },
            { result: '凶', message: '慎重に行動しましょう', color: '#9b59b6' },
            { result: '大凶', message: '厄落としのチャンス！', color: '#34495e' }
        ];

        function drawOmikuji() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '...';

            let count = 0;
            const interval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * fortunes.length);
                resultDiv.innerHTML = fortunes[randomIndex].result;
                resultDiv.style.color = fortunes[randomIndex].color;
                count++;

                if (count > 10) {
                    clearInterval(interval);
                    const finalIndex = Math.floor(Math.random() * fortunes.length);
                    const fortune = fortunes[finalIndex];
                    resultDiv.innerHTML = `
                        ${fortune.result}
                        <div class="fortune-text">${fortune.message}</div>
                    `;
                    resultDiv.style.color = fortune.color;
                }
            }, 100);
        }
    </script>
</body>
</html>
