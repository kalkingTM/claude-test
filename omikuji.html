<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙おみくじ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #0a0a2e 0%, #1a1a4e 50%, #0d0d35 100%);
            overflow: hidden;
            position: relative;
        }
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .shooting-star {
            position: absolute;
            width: 100px;
            height: 2px;
            background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,1));
            animation: shoot 3s linear infinite;
            opacity: 0;
        }
        @keyframes shoot {
            0% { transform: translateX(-100px) translateY(0); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: translateX(300px) translateY(150px); opacity: 0; }
            100% { opacity: 0; }
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 60px rgba(100, 100, 255, 0.2);
            max-width: 400px;
            width: 90%;
            z-index: 10;
            position: relative;
        }
        h1 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 2em;
            text-shadow: 0 0 20px rgba(150, 150, 255, 0.8);
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            margin-bottom: 30px;
        }
        .omikuji-box {
            width: 180px;
            height: 200px;
            margin: 0 auto 30px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .omikuji-box:hover {
            transform: scale(1.05);
        }
        .omikuji-box:active {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        .box-body {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #1a0a30 0%, #2d1b4e 50%, #1a0a30 100%);
            border-radius: 10px 10px 15px 15px;
            position: absolute;
            bottom: 0;
            border: 2px solid #4a3a6a;
            box-shadow: 0 5px 20px rgba(100, 50, 150, 0.5), inset 0 -20px 40px rgba(0, 0, 0, 0.3);
        }
        .box-body::before {
            content: '御神籤';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #c9a227;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(201, 162, 39, 0.5);
            writing-mode: vertical-rl;
        }
        .box-hole {
            width: 40px;
            height: 15px;
            background: #0a0a20;
            border-radius: 50%;
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            border: 1px solid #3a2a5a;
        }
        .stick {
            width: 8px;
            height: 80px;
            background: linear-gradient(to right, #d4a574, #e8c9a0, #d4a574);
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 3px;
            transition: top 0.3s;
            box-shadow: 0 0 10px rgba(255, 200, 100, 0.3);
        }
        .stick.drawing {
            animation: drawStick 0.8s ease-out;
        }
        @keyframes drawStick {
            0% { top: -30px; }
            50% { top: -80px; }
            100% { top: -30px; }
        }
        #result {
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s, transform 0.5s;
        }
        #result.show {
            opacity: 1;
            transform: translateY(0);
        }
        .fortune-result {
            font-size: 3.5em;
            font-weight: bold;
            text-shadow: 0 0 30px currentColor;
        }
        .fortune-text {
            font-size: 1em;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 10px;
        }
        .instruction {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85em;
            margin-top: 10px;
        }
        .planet {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
        }
        .planet1 {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #ff9966, #cc5533);
            top: 10%;
            right: 10%;
            box-shadow: 0 0 30px rgba(255, 153, 102, 0.5);
        }
        .planet2 {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #66aaff, #3366cc);
            bottom: 15%;
            left: 5%;
            box-shadow: 0 0 40px rgba(102, 170, 255, 0.4);
        }
        .planet2::after {
            content: '';
            position: absolute;
            width: 140px;
            height: 20px;
            border: 3px solid rgba(150, 200, 255, 0.4);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(70deg);
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="planet planet1"></div>
    <div class="planet planet2"></div>

    <div class="container">
        <h1>宇宙おみくじ</h1>
        <p class="subtitle">星々の導きを受けよう</p>

        <div class="omikuji-box" onclick="drawOmikuji()" id="omikujiBox">
            <div class="stick" id="stick"></div>
            <div class="box-body">
                <div class="box-hole"></div>
            </div>
        </div>

        <p class="instruction">箱をクリックしておみくじを引く</p>

        <div id="result">
            <div class="fortune-result" id="fortuneResult"></div>
            <div class="fortune-text" id="fortuneText"></div>
        </div>
    </div>

    <script>
        // Create stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = star.style.height = Math.random() * 3 + 1 + 'px';
            star.style.animationDelay = Math.random() * 2 + 's';
            star.style.animationDuration = (Math.random() * 2 + 1) + 's';
            starsContainer.appendChild(star);
        }

        // Create shooting stars
        for (let i = 0; i < 3; i++) {
            const shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.top = Math.random() * 50 + '%';
            shootingStar.style.left = Math.random() * 50 + '%';
            shootingStar.style.animationDelay = (Math.random() * 5 + i * 3) + 's';
            starsContainer.appendChild(shootingStar);
        }

        const fortunes = [
            { result: '大吉', message: '宇宙のエネルギーがあなたを包む！最高の運勢！', color: '#ffd700' },
            { result: '中吉', message: '星々があなたを見守っています', color: '#ff9966' },
            { result: '小吉', message: '小さな幸運が舞い降りるでしょう', color: '#66ffcc' },
            { result: '吉', message: '穏やかな星の光に導かれます', color: '#66aaff' },
            { result: '末吉', message: '希望の光が見え始めています', color: '#cc99ff' },
            { result: '凶', message: '流れ星に願いを込めて', color: '#ff6699' },
            { result: '大凶', message: 'ブラックホールを抜けた先に光がある！', color: '#9966ff' }
        ];

        let isDrawing = false;

        function drawOmikuji() {
            if (isDrawing) return;
            isDrawing = true;

            const stick = document.getElementById('stick');
            const resultDiv = document.getElementById('result');
            const fortuneResult = document.getElementById('fortuneResult');
            const fortuneText = document.getElementById('fortuneText');

            resultDiv.classList.remove('show');
            stick.classList.add('drawing');

            setTimeout(() => {
                const finalIndex = Math.floor(Math.random() * fortunes.length);
                const fortune = fortunes[finalIndex];

                fortuneResult.textContent = fortune.result;
                fortuneResult.style.color = fortune.color;
                fortuneText.textContent = fortune.message;

                resultDiv.classList.add('show');
                stick.classList.remove('drawing');
                isDrawing = false;
            }, 800);
        }
    </script>
</body>
</html>
